name: AIR Redis State Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/redis-state-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-redis-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redis-state-integration:
    name: Redis shared OAuth state (GitHub-hosted Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip check

      - name: Run OAuth state tests against disposable Redis 7
        env:
          AIR_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest -q tests/test_oauth_state.py
