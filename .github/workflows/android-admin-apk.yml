name: AIR Admin Android APK

on:
  push:
    branches:
      - build/android-admin-user-apks
    paths:
      - 'mobile/**'
      - '.github/workflows/android-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-admin-android-apk
  cancel-in-progress: false

jobs:
  build-admin-apk:
    name: Build AIR Admin ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create . --platforms=android --org com.analyticalstocks
      - name: Set unique administrator Android application ID
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit("Android app Gradle file not found")
          source = path.read_text()
          patterns = [
              (r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.analyticalstocks.air.admin"'),
              (r'applicationId\s+"[^"]+"', 'applicationId "com.analyticalstocks.air.admin"'),
          ]
          for pattern, replacement in patterns:
              updated, count = re.subn(pattern, replacement, source, count=1)
              if count:
                  path.write_text(updated)
                  print(f"Set administrator application ID in {path}")
                  break
          else:
              raise SystemExit("Could not find applicationId declaration")
          PY
      - name: Configure Android network permissions for AIR PC testing
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if "android.permission.INTERNET" not in source:
              source = source.replace("<manifest", '<manifest\\n    xmlns:android="http://schemas.android.com/apk/res/android"', 1) if 'xmlns:android=' not in source else source
              source = source.replace("<application", '    <uses-permission android:name="android.permission.INTERNET" />\\n    <application', 1)
          if "android:usesCleartextTraffic" not in source:
              source = re.sub(r"<application\\b", '<application android:usesCleartextTraffic="true"', source, count=1)
          manifest.write_text(source)
          print("Enabled internet and HTTP access for trusted local AIR PC testing; production must use HTTPS.")
          PY
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build dedicated administrator APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --target lib/admin_main.dart
      - name: Verify and checksum administrator APK
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86_64)/'; then exit 1; fi
          sha256sum "$APK" | tee AIR-Admin-Android-SHA256.txt
          mkdir -p dist
          cp "$APK" dist/AIR-Admin-ARM64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AIR-Admin-Android-ARM64-APK
          path: |
            dist/AIR-Admin-ARM64.apk
            AIR-Admin-Android-SHA256.txt
          if-no-files-found: error
          retention-days: 30
