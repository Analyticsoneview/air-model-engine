name: AIR Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'deploy/**'
      - 'docker-stack.yml'
      - '.github/workflows/air-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the built images to the configured Ubuntu Docker Swarm server"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: air-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend and build inputs
    runs-on: ${{ fromJSON(vars.AIR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Validate production API URL
        env:
          AIR_API_BASE_URL: ${{ vars.AIR_API_BASE_URL }}
        run: |
          test -n "$AIR_API_BASE_URL"
          case "$AIR_API_BASE_URL" in https://*) ;; *) echo "AIR_API_BASE_URL must be a public HTTPS URL" >&2; exit 1 ;; esac
      - name: Validate deployment files
        run: |
          test -s backend/Dockerfile
          test -s deploy/pwa.Dockerfile
          test -s docker-stack.yml
          test -s deploy/deploy-swarm.sh
          bash -n deploy/deploy-swarm.sh

  build-and-publish:
    name: Build and publish AIR images
    needs: verify
    runs-on: ${{ fromJSON(vars.AIR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    outputs:
      image_owner: ${{ steps.image.outputs.owner_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize image namespace
        id: image
        shell: bash
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AIR API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner_lc }}/air-model-engine-api:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner_lc }}/air-model-engine-api:latest
      - name: Build and push AIR PWA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/pwa.Dockerfile
          build-args: |
            AIR_API_BASE_URL=${{ vars.AIR_API_BASE_URL }}
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner_lc }}/air-model-engine-pwa:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner_lc }}/air-model-engine-pwa:latest

  deploy:
    name: Deploy to Ubuntu Docker Swarm
    needs: build-and-publish
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.AIR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          AIR_API_BASE_URL: ${{ vars.AIR_API_BASE_URL }}
        run: |
          test -n "$AIR_API_BASE_URL"
          case "$AIR_API_BASE_URL" in https://*) ;; *) echo "AIR_API_BASE_URL must be a public HTTPS URL" >&2; exit 1 ;; esac
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/air_deploy_key
          chmod 600 ~/.ssh/air_deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy immutable image versions
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_OWNER: ${{ needs['build-and-publish'].outputs.image_owner }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/air_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch origin main && git checkout --detach '$DEPLOY_COMMIT' && AIR_BACKEND_IMAGE='ghcr.io/$IMAGE_OWNER/air-model-engine-api:$IMAGE_TAG' AIR_PWA_IMAGE='ghcr.io/$IMAGE_OWNER/air-model-engine-pwa:$IMAGE_TAG' bash deploy/deploy-swarm.sh"
