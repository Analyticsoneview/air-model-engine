name: AIR Android Lab APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/air-telegram-alerts]
permissions:
  contents: read
jobs:
  android-lab:
    runs-on: [self-hosted, Windows, X64, air-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Expose Git Bash and jq to runner service
        shell: cmd
        run: |
          set "CI_TOOLS=%RUNNER_TEMP%\air-ci-tools"
          if not exist "%CI_TOOLS%\jq.exe" (
            if not exist "%CI_TOOLS%" mkdir "%CI_TOOLS%"
            curl.exe -fL --retry 3 --retry-delay 2 -o "%CI_TOOLS%\jq.exe" "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe"
            if errorlevel 1 exit /b 1
          )
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo %CI_TOOLS%>>"%GITHUB_PATH%"
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"
          "%CI_TOOLS%\jq.exe" --version
      - name: Set up current stable Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify build tools
        shell: cmd
        run: flutter --version && java -version && adb version && where bash && where jq
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: cmd
        run: if not exist android flutter create . --platforms=android --org com.analyticalstocks
      - name: Resolve packages
        working-directory: mobile
        shell: cmd
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        shell: cmd
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        shell: cmd
        run: flutter test
      - name: Build optimized ARM64 lab APK
        working-directory: mobile
        shell: cmd
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload optimized APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Model-Engine-Android-ARM64-Release-Lab
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
