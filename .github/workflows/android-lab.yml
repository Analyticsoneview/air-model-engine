name: AIR Android Lab APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/air-telegram-alerts]
permissions:
  contents: read
jobs:
  android-lab:
    runs-on: [self-hosted, Windows, X64, air-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Flutter 3.47.9 and Dart 3.13.7
        shell: cmd
        run: |
          if not defined RUNNER_TOOL_CACHE set "RUNNER_TOOL_CACHE=%RUNNER_TEMP%\_tool"
          set "FLUTTER_ROOT=%RUNNER_TOOL_CACHE%\air-flutter-3.47.9"
          set "FLUTTER_ZIP=%RUNNER_TEMP%\flutter_windows_3.47.9-stable.zip"
          if not exist "%FLUTTER_ROOT%\flutter\bin\flutter.bat" (
            if not exist "%FLUTTER_ZIP%" (
              curl.exe -fL --retry 5 --retry-delay 5 --retry-all-errors --max-time 1800 -o "%FLUTTER_ZIP%" "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.9-stable.zip"
              if errorlevel 1 exit /b 1
            )
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $zip='%FLUTTER_ZIP%'; $expected='d8e2b5977e09082c6440f89dc1aa887b94c8fbcc3b39222797046295a3f68a9e'; $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant(); if ($actual -ne $expected) { throw 'Flutter SDK SHA256 mismatch' }; New-Item -ItemType Directory -Force -Path '%FLUTTER_ROOT%' | Out-Null; Expand-Archive -LiteralPath $zip -DestinationPath '%FLUTTER_ROOT%' -Force"
            if errorlevel 1 exit /b 1
          )
          if not exist "%FLUTTER_ROOT%\flutter\bin\flutter.bat" exit /b 1
          echo %FLUTTER_ROOT%\flutter\bin>>"%GITHUB_PATH%"
          "%FLUTTER_ROOT%\flutter\bin\flutter.bat" --version
          "%FLUTTER_ROOT%\flutter\bin\cache\dart-sdk\bin\dart.exe" --version
      - name: Verify Android build tools
        shell: cmd
        run: flutter --version && dart --version && java -version && adb version
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: cmd
        run: if not exist android flutter create . --platforms=android --org com.analyticalstocks
      - name: Resolve packages
        working-directory: mobile
        shell: cmd
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        shell: cmd
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        shell: cmd
        run: flutter test
      - name: Build optimized ARM64 lab APK
        working-directory: mobile
        shell: cmd
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload optimized APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Model-Engine-Android-ARM64-Release-Lab
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
