name: AIR Android Lab APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/air-telegram-alerts]
permissions:
  contents: read
jobs:
  android-lab:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.AIR_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Android build tools
        run: flutter --version && dart --version && java -version
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.analyticalstocks
          fi
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Build optimized ARM64 lab APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload optimized APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Model-Engine-Android-ARM64-Release-Lab
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
