name: AIR Android Lab APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-lab.yml'

permissions:
  contents: read

jobs:
  android-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android platform
        working-directory: mobile
        run: flutter create . --platforms=android --org com.analyticalstocks

      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib

      - name: Build internal lab APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=APP_ENV=lab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Model-Engine-Android-Lab
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
