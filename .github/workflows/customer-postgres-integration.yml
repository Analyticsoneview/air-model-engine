name: AIR Customer PostgreSQL Integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-customer-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  customer-postgres-integration:
    name: Customer auth PostgreSQL integration (disposable DB)
    runs-on: self-hosted
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4

      # Cache the portable Python runtime and pip downloads. The cache key is
      # tied to backend requirements so dependency changes naturally invalidate it.
      - name: Restore Python and pip caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\AIR-Python312-embed
            ${{ runner.temp }}\python-3.12.10-embed-amd64.zip
            ${{ runner.temp }}\get-pip.py
            ${{ runner.temp }}\pip-cache
          key: air-customer-py312-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            air-customer-py312-${{ runner.os }}-

      - name: Bootstrap portable Python 3.12
        run: |
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $pythonHome = Join-Path $env:RUNNER_TEMP 'AIR-Python312-embed'
          $python = Join-Path $pythonHome 'python.exe'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.12.10-embed-amd64.zip'
          $pipCache = Join-Path $env:RUNNER_TEMP 'pip-cache'
          New-Item -ItemType Directory -Force -Path $pythonHome,$pipCache | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $pythonHome 'python312.zip'))) {
            if (-not (Test-Path -LiteralPath $zip) -or (Get-Item $zip).Length -lt 10MB) {
              & curl.exe --fail --location --show-error --retry 4 --retry-all-errors --connect-timeout 30 --max-time 900 --output $zip 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip) -or (Get-Item $zip).Length -lt 10MB) { throw 'Python embeddable ZIP download failed.' }
            }
            Expand-Archive -LiteralPath $zip -DestinationPath $pythonHome -Force
          }
          $pth = Join-Path $pythonHome 'python312._pth'
          if (-not (Test-Path $pth)) { throw "Python path configuration file missing: $pth" }
          $pthLines = @('python312.zip','.', 'Lib\site-packages', (Join-Path $env:GITHUB_WORKSPACE 'backend'), 'import site')
          Set-Content -LiteralPath $pth -Value $pthLines -Encoding ascii
          New-Item -ItemType Directory -Force -Path (Join-Path $pythonHome 'Lib\site-packages') | Out-Null
          & $python -c "import encodings,sys; print(sys.version); print(sys.executable)"
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python validation failed.' }
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath $getPip) -or (Get-Item $getPip).Length -lt 100KB) {
            & curl.exe --fail --location --show-error --retry 4 --retry-all-errors --connect-timeout 30 --max-time 300 --output $getPip 'https://bootstrap.pypa.io/get-pip.py'
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $getPip)) { throw 'Could not download pip bootstrap.' }
          }
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) {
            & $python $getPip --disable-pip-version-check
            if ($LASTEXITCODE -ne 0) { throw 'pip bootstrap failed.' }
          }
          & $python -m pip --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable Python pip validation failed.' }
          "AIR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PIP_CACHE_DIR=$pipCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install backend dependencies
        working-directory: .
        run: |
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & $env:AIR_PYTHON -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw 'Python packaging toolchain installation failed.' }
          & $env:AIR_PYTHON -m pip install --disable-pip-version-check -r backend/requirements.txt pytest pytest-asyncio
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency installation failed.' }
          & $env:AIR_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency consistency check failed.' }

      - name: Start disposable PostgreSQL 16 and run real migration tests
        working-directory: backend
        timeout-minutes: 15
        run: |
          $container = "air-customer-pg-ci-$env:GITHUB_RUN_ID"
          docker version
          if ($LASTEXITCODE -ne 0) { throw 'Docker Engine is unavailable on the self-hosted runner; PostgreSQL integration tests cannot be safely skipped.' }
          try {
            # Ask Docker/Windows to allocate an available ephemeral host port.
            # A fixed port can fall inside Windows excluded TCP port ranges even
            # when Get-NetTCPConnection reports no listener.
            docker run --detach --rm --name $container -e POSTGRES_USER=air_test -e POSTGRES_PASSWORD=air_test -e POSTGRES_DB=air_test -p "127.0.0.1::5432" postgres:16-alpine
            if ($LASTEXITCODE -ne 0) { throw 'Could not start disposable PostgreSQL 16 container.' }
            $binding = docker port $container 5432/tcp
            if ($LASTEXITCODE -ne 0 -or -not $binding) { throw 'Could not determine the disposable PostgreSQL host port.' }
            $portText = (($binding | Select-Object -First 1) -split ':')[-1]
            $port = 0
            if (-not [int]::TryParse($portText, [ref]$port) -or $port -lt 1) { throw "Docker returned an invalid PostgreSQL host binding: $binding" }
            Write-Host "Disposable PostgreSQL mapped to 127.0.0.1:$port"
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              docker exec $container pg_isready -U air_test -d air_test
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { docker logs $container; throw 'Disposable PostgreSQL did not become ready within 120 seconds.' }
            $url = "postgresql+psycopg://air_test:air_test@127.0.0.1:$port/air_test"
            $env:AIR_CUSTOMER_DATABASE_URL = $url
            $env:AIR_TEST_CUSTOMER_DATABASE_URL = $url
            $env:AIR_TEST_ADMIN_DATABASE_URL = $url
            & $env:AIR_PYTHON -m alembic upgrade head
            if ($LASTEXITCODE -ne 0) { throw 'Alembic upgrade head failed against disposable PostgreSQL.' }
            & $env:AIR_PYTHON -m pytest -q tests/test_customer_auth_access_postgres.py tests/test_admin_postgres_migration.py tests/test_admin_auth_postgres_store.py
            if ($LASTEXITCODE -ne 0) { throw 'Customer/Admin PostgreSQL integration tests failed.' }
          }
          finally {
            docker rm --force $container 2>$null | Out-Null
          }
