name: AIR Customer PostgreSQL Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/customer-postgres-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-customer-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  customer-postgres-integration:
    name: Customer auth PostgreSQL integration (disposable PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIR_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL 16 container
        run: |
          set -euo pipefail
          container="air-customer-pg-${GITHUB_RUN_ID}"
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker run -d --name "$container" -e POSTGRES_USER=air_test -e POSTGRES_PASSWORD=air_test -e POSTGRES_DB=air_test -p 5432:5432 postgres:16-alpine
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec "$container" pg_isready -U air_test -d air_test; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker logs "$container"; exit 1; fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pip check

      - name: Run real PostgreSQL migration
        run: python -m alembic upgrade head

      - name: Run customer auth PostgreSQL integration tests
        run: python -m pytest -q tests/test_customer_auth_access_postgres.py

      - name: Cleanup PostgreSQL container
        if: always()
        run: docker rm -f "air-customer-pg-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
