name: AIR Customer PostgreSQL Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/customer-postgres-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-customer-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  customer-postgres-integration:
    name: Customer auth PostgreSQL integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: air_test
          POSTGRES_PASSWORD: air_test
          POSTGRES_DB: air_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air_test -d air_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      AIR_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pip check
      - name: Run real PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Run customer auth PostgreSQL integration tests
        run: python -m pytest -q tests/test_customer_auth_access_postgres.py
