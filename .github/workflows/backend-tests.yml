name: AIR Backend Tests
on:
  push:
    branches: [main, feat/air-telegram-alerts]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python
        shell: cmd
        run: python --version && python -m pip --version
      - name: Install dependencies
        working-directory: backend
        shell: cmd
        run: python -m pip install -r requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        shell: cmd
        run: python -m unittest discover -s tests -v
