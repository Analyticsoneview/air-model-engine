name: AIR Backend Tests
on:
  pull_request:
  push:
    branches: [main, feat/air-telegram-alerts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.AIR_CI_RUNNER_LABELS || '["self-hosted","Windows","X64","air-ci"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Verify machine-wide Python 3.12
        run: |
          $python = 'C:\AIR\tools\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw "AIR Python 3.12 not found at $python. Run the AIR Master ZIP prerequisite repair." }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'AIR Python version check failed.' }
          "AIR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install backend dependencies
        working-directory: backend
        run: |
          & $env:AIR_PYTHON -m pip install --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency installation failed.' }
      - name: Run backend unit tests
        working-directory: backend
        run: |
          & $env:AIR_PYTHON -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Backend unit tests failed.' }
