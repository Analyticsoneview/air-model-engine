name: AIR Backend Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
      - name: Verify machine-wide Python 3.12
        run: |
          $python = 'C:\AIR\tools\Python312\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw "AIR Python 3.12 not found at $python. Run the AIR Master ZIP prerequisite repair." }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw 'AIR Python version check failed.' }
          "AIR_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install backend dependencies
        working-directory: .
        run: |
          $env:PYTHONHOME = 'C:\AIR\tools\Python312'
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & $env:AIR_PYTHON -m pip install --disable-pip-version-check -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency installation failed.' }
      - name: Run backend unit tests
        working-directory: .
        run: |
          $env:PYTHONHOME = 'C:\AIR\tools\Python312'
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          & $env:AIR_PYTHON -m unittest discover -s backend/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Backend unit tests failed.' }
