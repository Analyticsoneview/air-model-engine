name: AIR Backend Tests
on:
  pull_request:
  push:
    branches: [main, feat/air-telegram-alerts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap portable Python 3.12 for runner service
        shell: cmd
        run: |
          set "PYTHON_DIR=%RUNNER_TEMP%\air-python312"
          set "PYTHON_ZIP=%RUNNER_TEMP%\python-3.12.10-embed-amd64.zip"
          if not exist "%PYTHON_DIR%\python.exe" (
            if not exist "%PYTHON_ZIP%" (
              curl.exe -fL --retry 3 --retry-delay 2 -o "%PYTHON_ZIP%" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
              if errorlevel 1 exit /b 1
            )
            if not exist "%PYTHON_DIR%" mkdir "%PYTHON_DIR%"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%PYTHON_ZIP%' -DestinationPath '%PYTHON_DIR%' -Force"
            if errorlevel 1 exit /b 1
            if not exist "%PYTHON_DIR%\python312._pth" exit /b 1
            if not exist "%PYTHON_DIR%\Lib\site-packages" mkdir "%PYTHON_DIR%\Lib\site-packages"
            (
              echo python312.zip
              echo .
              echo Lib\site-packages
              echo import site
            ) > "%PYTHON_DIR%\python312._pth"
            curl.exe -fL --retry 3 --retry-delay 2 -o "%PYTHON_DIR%\get-pip.py" "https://bootstrap.pypa.io/get-pip.py"
            if errorlevel 1 exit /b 1
            "%PYTHON_DIR%\python.exe" "%PYTHON_DIR%\get-pip.py"
            if errorlevel 1 exit /b 1
          )
          if not exist "%PYTHON_DIR%\python.exe" exit /b 1
          echo %PYTHON_DIR%>>"%GITHUB_PATH%"
          "%PYTHON_DIR%\python.exe" --version
          "%PYTHON_DIR%\python.exe" -m pip --version
      - name: Verify Python
        shell: cmd
        run: python --version && python -m pip --version
      - name: Install Python build tools
        shell: cmd
        run: python -m pip install --upgrade setuptools wheel
      - name: Install dependencies
        working-directory: backend
        shell: cmd
        run: python -m pip install -r requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        shell: cmd
        run: python -m unittest discover -s tests -v
