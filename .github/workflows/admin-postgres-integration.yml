name: AIR Admin and Customer PostgreSQL Integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-admin-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-postgres-integration:
    name: Admin + customer PostgreSQL/Redis integration (disposable services)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: air_test
          POSTGRES_PASSWORD: air_test
          POSTGRES_DB: air_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air_test -d air_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AIR_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_ADMIN_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_QOC_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_MARKET_INSTRUMENT_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_MARKET_SOURCE_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_EXECUTION_POLICY_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_ORDER_LEDGER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_USAGE_DATABASE_URL: postgresql+psycopg://air_usage_test:air_usage_test@127.0.0.1:5432/air_test
      AIR_TEST_ADMIN_REDIS_URL: redis://127.0.0.1:6379/0
      AIR_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pip check

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify sector migration 0035 upgrade/downgrade on disposable PostgreSQL
        working-directory: backend
        env:
          AIR_RUN_SECTOR_MIGRATION_ROUNDTRIP: "1"
        run: python -m pytest -q tests/test_sector_migration_0035_roundtrip.py

      - name: Create least-privilege usage RLS test role
        env:
          PGPASSWORD: air_test
        run: |
          psql -h 127.0.0.1 -U air_test -d air_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE air_usage_test LOGIN PASSWORD 'air_usage_test'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE air_test TO air_usage_test;
          GRANT USAGE ON SCHEMA public TO air_usage_test;
          GRANT SELECT, INSERT, UPDATE ON air_usage_events, air_usage_counters, air_usage_quota_overrides TO air_usage_test;
          SQL

      - name: Run admin and customer PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -q tests/test_admin_auth_postgres_store.py tests/test_customer_auth_postgres.py tests/test_customer_credentials_postgres.py tests/test_oauth_state.py tests/test_broker_persistence_postgres.py tests/test_qoc_postgres_store.py tests/test_market_instrument_postgres.py tests/test_market_data_source_postgres.py tests/test_execution_order_postgres.py tests/test_portfolio_postgres_store.py tests/test_support_center_postgres.py tests/test_workflow_runtime_postgres.py tests/test_usage_metering_postgres.py tests/test_market_data_schema_isolation.py tests/test_postgres_migration_chain.py
