name: AIR Admin and Customer PostgreSQL Integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-admin-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-postgres-integration:
    name: Admin + customer PostgreSQL/Redis integration (disposable services)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: air_test
          POSTGRES_PASSWORD: air_test
          POSTGRES_DB: air_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air_test -d air_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AIR_ADMIN_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_TEST_ADMIN_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pip check

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run admin and customer PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -q tests/test_admin_auth_postgres_store.py tests/test_customer_auth_postgres.py
