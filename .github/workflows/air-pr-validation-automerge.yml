name: AIR PR Validation (Backend + Android)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: air-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: self-hosted
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/air-pr-validation-automerge.yml'
            android:
              - 'mobile/**'

  backend:
    needs: changes
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/backend-tests.yml

  postgres-integration:
    needs: changes
    uses: ./.github/workflows/customer-postgres-integration.yml

  redis-integration:
    needs: changes
    uses: ./.github/workflows/redis-state-integration.yml

  android:
    needs: [changes, backend, postgres-integration, redis-integration]
    if: always() && github.event.action != 'closed' && needs.backend.result == 'success' && needs.postgres-integration.result == 'success' && needs.redis-integration.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true')
    name: Android ARM64 APK build
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Flutter SDK (Windows-native persistent cache)
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterRoot = 'C:\AIR\flutter-stable'
          $flutterBat = Join-Path $flutterRoot 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterBat)) {
            if (Test-Path -LiteralPath $flutterRoot) { throw "Flutter cache exists but is incomplete: $flutterRoot" }
            New-Item -ItemType Directory -Force -Path (Split-Path $flutterRoot -Parent) | Out-Null
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $flutterRoot
            if ($LASTEXITCODE -ne 0) { throw 'Flutter stable SDK checkout failed.' }
          } else {
            Write-Host 'Reusing persistent Flutter stable SDK cache.'
          }
          $flutterBin = Join-Path $flutterRoot 'bin'
          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $flutterBat --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK bootstrap failed.' }
          "AIR_FLUTTER=$flutterBat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Set Flutter launcher
        run: |
          "AIR_FLUTTER=flutter" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Android SDK command-line tools (Windows-native)
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = 'C:\Android\Sdk'
          $toolsRoot = Join-Path $sdkRoot 'cmdline-tools'
          $latest = Join-Path $toolsRoot 'latest'
          $archive = Join-Path $env:RUNNER_TEMP 'android-commandline-tools.zip'
          New-Item -ItemType Directory -Force -Path $toolsRoot | Out-Null
          $sdkManager = Join-Path $latest 'bin\\sdkmanager.bat'
          if (-not (Test-Path -LiteralPath $sdkManager)) {
            Write-Host 'Android command-line tools are not cached; downloading once.'
            $downloaded = $false
            for ($attempt = 1; $attempt -le 3 -and -not $downloaded; $attempt++) {
              try {
                Write-Host "Android SDK tools download attempt $attempt/3"
                Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip' -OutFile $archive -UseBasicParsing -TimeoutSec 180
                if (-not (Test-Path -LiteralPath $archive) -or (Get-Item -LiteralPath $archive).Length -lt 10000000) { throw 'Android command-line tools download is missing or unexpectedly small.' }
                $downloaded = $true
              } catch {
                Write-Warning $_
                if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if (-not $downloaded) { throw 'Android command-line tools download failed after three attempts.' }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
            try { if (-not ($zip.Entries | Where-Object { $_.FullName -eq 'cmdline-tools/bin/sdkmanager.bat' })) { throw 'Downloaded Android SDK archive does not contain sdkmanager.bat.' } } finally { $zip.Dispose() }
            if (Test-Path -LiteralPath $latest) { Remove-Item -LiteralPath $latest -Recurse -Force }
            $extract = Join-Path $env:RUNNER_TEMP 'android-commandline-tools-extract'
            if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            Move-Item -LiteralPath (Join-Path $extract 'cmdline-tools') -Destination $latest
            $sdkManager = Join-Path $latest 'bin\\sdkmanager.bat'
            if (-not (Test-Path -LiteralPath $sdkManager)) { throw 'Android SDK manager was not installed.' }
          } else {
            Write-Host 'Reusing cached Android command-line tools from the persistent self-hosted runner.'
          }
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $latest 'bin') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          (Join-Path $sdkRoot 'platform-tools') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          1..50 | ForEach-Object { 'y' } | & $sdkManager "--sdk_root=$sdkRoot" --licenses | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK license acceptance failed.' }
      - name: Install required Android platform and build tools
        run: |
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkManager "--sdk_root=$env:ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK component installation failed.' }
      - name: Generate Android platform when missing
        working-directory: mobile
        run: |
          if (-not (Test-Path -LiteralPath 'android')) {
            & $env:AIR_FLUTTER create . --platforms=android --org com.analyticalstocks
            if ($LASTEXITCODE -ne 0) { throw 'Flutter Android platform generation failed.' }
          }
      - name: Enable HTTP only for trusted-LAN lab backend
        working-directory: mobile
        run: |
          $manifest = Join-Path $PWD 'android/app/src/main/AndroidManifest.xml'
          if (-not (Test-Path -LiteralPath $manifest)) { throw "Android manifest missing: $manifest" }
          $xml = Get-Content -LiteralPath $manifest -Raw
          if ($xml -notmatch 'usesCleartextTraffic') {
            $xml = [regex]::Replace($xml, '<application(?=\s|>)', '<application android:usesCleartextTraffic="true"', 1)
          }
          Set-Content -LiteralPath $manifest -Value $xml -Encoding utf8
          if ((Get-Content -LiteralPath $manifest -Raw) -notmatch 'android:usesCleartextTraffic="true"') { throw 'Lab HTTP traffic setting was not applied.' }
      - name: Resolve packages
        working-directory: mobile
        run: |
          & $env:AIR_FLUTTER pub get
          if ($LASTEXITCODE -ne 0) { throw 'Flutter package resolution failed.' }
      - name: Analyze Flutter app
        working-directory: mobile
        run: |
          & $env:AIR_FLUTTER analyze --no-fatal-infos lib
          if ($LASTEXITCODE -ne 0) { throw 'Flutter analysis failed.' }
      - name: Run Flutter tests
        working-directory: mobile
        run: |
          & $env:AIR_FLUTTER test
          if ($LASTEXITCODE -ne 0) { throw 'Flutter tests failed.' }
      - name: Build ARM64 lab APK
        working-directory: mobile
        run: |
          & $env:AIR_FLUTTER build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
          if ($LASTEXITCODE -ne 0) { throw 'Android ARM64 APK build failed.' }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        timeout-minutes: 30
        with:
          compression-level: 0
          name: AIR-Android-ARM64-PR-${{ github.event.pull_request.number || 'manual' }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
