name: AIR PR Validation (Backend + Android)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: air-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Backend tests (Python 3.12)
    runs-on: ${{ fromJSON(vars.AIR_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  android:
    if: github.event.action != 'closed'
    name: Android ARM64 APK build
    runs-on: ${{ fromJSON(vars.AIR_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Verify Android toolchain
        run: flutter --version && dart --version && java -version
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.analyticalstocks
          fi
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Build ARM64 lab APK
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Android-ARM64-PR-${{ github.event.pull_request.number || 'manual' }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  merge-after-validation:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.number == 7 && github.event.pull_request.draft == false
    needs: [backend, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge PR 7 after both validations pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch

  retarget-stacked-ui-pr:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.number == 7
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Move PR 8 onto main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit 8 --base main
