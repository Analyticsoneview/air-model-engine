name: AIR PR Validation (Backend + Android)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: air-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event.action != 'closed'
    name: Backend tests (Python 3.12)
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Python 3.12 for runner service
        shell: cmd
        run: |
          set "PYTHON_VERSION=3.12.10"
          set "PYTHON_DIR=%RUNNER_TEMP%\air-python312"
          set "PYTHON_INSTALLER=%RUNNER_TEMP%\python-3.12.10-amd64.exe"
          if not exist "%PYTHON_DIR%\python.exe" (
            curl.exe -fL --retry 3 --retry-delay 2 -o "%PYTHON_INSTALLER%" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
            if errorlevel 1 exit /b 1
            "%PYTHON_INSTALLER%" /quiet InstallAllUsers=0 TargetDir="%PYTHON_DIR%" Include_pip=1 Include_launcher=0 PrependPath=0 Include_test=0 Shortcuts=0
            if errorlevel 1 exit /b 1
          )
          if not exist "%PYTHON_DIR%\python.exe" exit /b 1
          echo %PYTHON_DIR%>>"%GITHUB_PATH%"
          "%PYTHON_DIR%\python.exe" --version
          "%PYTHON_DIR%\python.exe" -m pip --version
      - name: Verify Python
        shell: cmd
        run: python --version && python -m pip --version
      - name: Install dependencies
        working-directory: backend
        shell: cmd
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        shell: cmd
        run: python -m unittest discover -s tests -v

  android:
    if: github.event.action != 'closed'
    name: Android ARM64 APK build
    runs-on: [self-hosted, Windows, X64, air-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Expose installed Git Bash to runner service
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          echo C:\Program Files\Git\usr\bin>>"%GITHUB_PATH%"
      - name: Set up current stable Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Android build tools
        shell: cmd
        run: |
          java -version
          flutter --version
          adb version
          where bash
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: cmd
        run: if not exist android flutter create . --platforms=android --org com.analyticalstocks
      - name: Resolve packages
        working-directory: mobile
        shell: cmd
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        shell: cmd
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        shell: cmd
        run: flutter test
      - name: Build ARM64 lab APK
        working-directory: mobile
        shell: cmd
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Android-ARM64-PR-${{ github.event.pull_request.number || 'manual' }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  retarget-stacked-ui-pr:
    name: Retarget dependent UI PR after PR 7 merges
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.number == 7
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - name: Move PR 8 onto main
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit 8 --base main
