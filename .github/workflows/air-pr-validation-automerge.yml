name: AIR PR Validation and Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: air-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python
        shell: cmd
        run: python --version
      - name: Install dependencies
        working-directory: backend
        shell: cmd
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        shell: cmd
        run: python -m unittest discover -s tests -v

  android:
    name: Android ARM64 APK build
    runs-on: [self-hosted, Windows, X64, air-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up current stable Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Android build tools
        shell: cmd
        run: |
          python --version
          java -version
          flutter --version
          adb version
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: cmd
        run: if not exist android flutter create . --platforms=android --org com.analyticalstocks
      - name: Resolve packages
        working-directory: mobile
        shell: cmd
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        shell: cmd
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        shell: cmd
        run: flutter test
      - name: Build ARM64 lab APK
        working-directory: mobile
        shell: cmd
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Android-ARM64-PR-${{ github.event.pull_request.number || 'manual' }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    if: github.event_name == 'workflow_dispatch'
    name: iOS unsigned IPA build
    runs-on: [self-hosted, macOS, air-mac]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple build tools
        run: |
          sw_vers
          xcodebuild -version
          flutter --version
      - name: Generate iOS platform
        working-directory: mobile
        run: flutter create . --platforms=ios --org com.analyticalstocks
      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Build unsigned iOS app
        working-directory: mobile
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=lab
      - name: Package and verify unsigned IPA
        working-directory: mobile
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/ipa/Payload
          rm -rf build/ios/ipa/Payload/Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          /usr/bin/zip -qry AIR-Model-Engine-iOS-Unsigned.ipa Payload
          test -s AIR-Model-Engine-iOS-Unsigned.ipa
          /usr/bin/unzip -t AIR-Model-Engine-iOS-Unsigned.ipa
          shasum -a 256 AIR-Model-Engine-iOS-Unsigned.ipa > AIR-Model-Engine-iOS-Unsigned.ipa.sha256
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-iOS-Unsigned-PR-${{ github.event.pull_request.number || 'manual' }}
          path: |
            mobile/build/ios/ipa/AIR-Model-Engine-iOS-Unsigned.ipa
            mobile/build/ios/ipa/AIR-Model-Engine-iOS-Unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

  merge-after-validation:
    name: Merge PR after successful validation
    needs: [backend, android]
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - name: Merge validated pull request
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge %PR_NUMBER% --squash

  retarget-stacked-ui-pr:
    name: Retarget dependent UI PR after PR 7 merges
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.number == 7
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - name: Move PR 8 onto main
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit 8 --base main
