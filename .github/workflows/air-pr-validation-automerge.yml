name: AIR PR Validation (Backend + Android)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Backend tests (Python 3.12)
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap portable Python 3.12 for runner service
        shell: cmd
        run: |
          set "PYTHON_DIR=%RUNNER_TEMP%\air-python312"
          set "PYTHON_ZIP=%RUNNER_TEMP%\python-3.12.10-embed-amd64.zip"
          if not exist "%PYTHON_DIR%\python.exe" (
            if not exist "%PYTHON_ZIP%" (
              curl.exe -fL --retry 3 --retry-delay 2 -o "%PYTHON_ZIP%" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
              if errorlevel 1 exit /b 1
            )
            if not exist "%PYTHON_DIR%" mkdir "%PYTHON_DIR%"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%PYTHON_ZIP%' -DestinationPath '%PYTHON_DIR%' -Force"
            if errorlevel 1 exit /b 1
            if not exist "%PYTHON_DIR%\python312._pth" exit /b 1
            if not exist "%PYTHON_DIR%\Lib\site-packages" mkdir "%PYTHON_DIR%\Lib\site-packages"
            (
              echo python312.zip
              echo .
              echo Lib\site-packages
              echo import site
            ) > "%PYTHON_DIR%\python312._pth"
            curl.exe -fL --retry 3 --retry-delay 2 -o "%PYTHON_DIR%\get-pip.py" "https://bootstrap.pypa.io/get-pip.py"
            if errorlevel 1 exit /b 1
            "%PYTHON_DIR%\python.exe" "%PYTHON_DIR%\get-pip.py"
            if errorlevel 1 exit /b 1
          )
          if not exist "%PYTHON_DIR%\python.exe" exit /b 1
          echo %PYTHON_DIR%>>"%GITHUB_PATH%"
          "%PYTHON_DIR%\python.exe" --version
          "%PYTHON_DIR%\python.exe" -m pip --version
      - name: Verify Python
        shell: cmd
        run: python --version && python -m pip --version
      - name: Install Python build tools
        shell: cmd
        run: python -m pip install --upgrade setuptools wheel
      - name: Install dependencies
        working-directory: backend
        shell: cmd
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        shell: cmd
        run: python -m unittest discover -s tests -v

  android:
    if: github.event.action != 'closed'
    name: Android ARM64 APK build
    runs-on: [self-hosted, Windows, X64, air-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter 3.47.9 from pinned Git tag
        shell: cmd
        run: |
          if not defined RUNNER_TOOL_CACHE set "RUNNER_TOOL_CACHE=%RUNNER_TEMP%\_tool"
          set "FLUTTER_ROOT=%RUNNER_TOOL_CACHE%\air-flutter-3.47.9"
          if not exist "%FLUTTER_ROOT%\bin\flutter.bat" (
            if exist "%FLUTTER_ROOT%" rmdir /s /q "%FLUTTER_ROOT%"
            git clone --depth 1 --branch 3.47.9 --single-branch https://github.com/flutter/flutter.git "%FLUTTER_ROOT%"
            if errorlevel 1 exit /b 1
          )
          set "FLUTTER_ACTUAL_SHA="
          for /f %%i in ('git -C "%FLUTTER_ROOT%" rev-parse HEAD') do set "FLUTTER_ACTUAL_SHA=%%i"
          if /I not "%FLUTTER_ACTUAL_SHA%"=="c197ca5199e9ee5661e865596c9c07294dfab51c" exit /b 1
          echo %FLUTTER_ROOT%\bin>>"%GITHUB_PATH%"
          "%FLUTTER_ROOT%\bin\flutter.bat" --version
          "%FLUTTER_ROOT%\bin\flutter.bat" precache --android
          "%FLUTTER_ROOT%\bin\cache\dart-sdk\bin\dart.exe" --version
      - name: Verify Android build tools
        shell: cmd
        run: flutter --version && dart --version && java -version && adb version
      - name: Generate Android platform only when missing
        working-directory: mobile
        shell: cmd
        run: if not exist android flutter create . --platforms=android --org com.analyticalstocks
      - name: Resolve packages
        working-directory: mobile
        shell: cmd
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile
        shell: cmd
        run: flutter analyze lib
      - name: Run Flutter tests
        working-directory: mobile
        shell: cmd
        run: flutter test
      - name: Build ARM64 lab APK
        working-directory: mobile
        shell: cmd
        run: flutter build apk --release --target-platform android-arm64 --dart-define=APP_ENV=lab --dart-define=AIR_API_BASE_URL="${{ vars.AIR_API_BASE_URL }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Android-ARM64-PR-${{ github.event.pull_request.number || 'manual' }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  retarget-stacked-ui-pr:
    permissions:
      pull-requests: write
    name: Retarget dependent UI PR after PR 7 merges
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.number == 7
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - name: Move PR 8 onto main
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr edit 8 --base main
