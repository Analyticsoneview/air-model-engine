name: AIR Gate 10 PostgreSQL Recovery Acceptance

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/workflow-gate10-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: air-gate10-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-workflow-recovery:
    name: PostgreSQL backup/restore and concurrent worker acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: air_test
          POSTGRES_PASSWORD: air_test
          POSTGRES_DB: air_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U air_test -d air_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: air_test
      AIR_CUSTOMER_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_test
      AIR_WORKFLOW_RESTORE_DATABASE_URL: postgresql+psycopg://air_test:air_test@127.0.0.1:5432/air_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install PostgreSQL client and backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
          python -m pip check
      - name: Apply migrations to disposable source database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Create isolated restore database
        run: createdb --host=127.0.0.1 --username=air_test air_restore
      - name: Verify backup, restore, indexes and concurrent worker recovery
        working-directory: backend
        run: python scripts/workflow_postgres_acceptance.py
      - name: Run PostgreSQL workflow lease and runtime regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_workflow_run_leases_gate10.py tests/test_workflow_runtime_postgres.py
