name: AIR Deployment Profile and AWS Terraform Acceptance

on:
  pull_request:
    paths:
      - 'AIRDEPLOY.ps1'
      - 'AIRDEPLOY.sh'
      - 'AIRSTART.ps1'
      - 'AIRSTART.sh'
      - 'deploy/DOCKER_SWARM.md'
      - 'deploy/rabbitmq.conf'
      - 'deploy/READINESS_REGISTER.md'
      - 'backend/Dockerfile'
      - 'backend/app/deployment_profiles.py'
      - 'backend/app/main.py'
      - 'backend/app/workflow_worker.py'
      - 'backend/config/deployment_profiles/**'
      - 'backend/tests/test_deployment_profiles.py'
      - 'backend/tests/test_onprem_deployment_acceptance.py'
      - 'scripts/ci/onprem-compose-runtime-smoke.sh'
      - 'scripts/air_manager.py'
      - 'scripts/release/**'
      - 'backend/tests/test_deployment_manager_release.py'
      - 'backend/tests/test_generate_local_secrets.py'
      - 'scripts/generate_local_secrets.py'
      - 'deploy/INSTALLATION.md'
      - 'docs/AIR_INSTALLATION_READINESS.md'
      - 'deploy/deploy-swarm.sh'
      - '.gitignore'
      - 'compose.local.yml'
      - 'docker-stack.yml'
      - 'deploy/README.md'
      - 'deploy/aws/terraform/**'
      - 'README.md'
      - '.github/workflows/deployment-profile-acceptance.yml'

permissions:
  contents: read

jobs:
  validate-deployment-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all deployment profiles
        run: |
          for profile in onprem-single aws-private-single aws-saas-multi; do
            PYTHONPATH=backend python -m app.deployment_profiles --profile "$profile"
          done
          python -m json.tool backend/config/deployment_profiles/profile.schema.json >/dev/null
      - name: Run deployment profile tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_deployment_profiles.py' -v
      - name: Run on-prem Compose and Swarm regression tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_onprem_deployment_acceptance.py' -v
      - name: Render on-prem Compose and Swarm configurations
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .air-secrets
          cleanup() { rm -rf .air-secrets .air-local.env; }
          trap cleanup EXIT
          for secret in jwt_secret credential_key admin_api_key admin_mfa_key postgres_password redis_password database_url redis_url rabbitmq_password telegram_bot_token; do
            printf 'acceptance-only-placeholder' > ".air-secrets/$secret"
          done
          : > .air-local.env
          docker compose -f compose.local.yml config --quiet
          AIR_OPERATOR_CUSTOMER_IDS='+919876543210' \
          AIR_TELEGRAM_CHAT_IDS='-1001234567890' \
          AIR_APP_DOMAIN='air.example.test' \
          AIR_API_DOMAIN='api.example.test' \
          AIR_TLS_EMAIL='ops@example.test' \
          AIR_CORS_ORIGINS='https://air.example.test' \
            docker compose -f docker-stack.yml config --quiet
      - name: Validate unified Deployment Manager profiles and Python syntax
        run: |
          for profile in onprem-single aws-private-single aws-saas-multi; do
            python scripts/air_manager.py --profile "$profile" validate
          done
          python -m py_compile scripts/air_manager.py scripts/release/build_release.py
      - name: Run Deployment Manager and release package tests
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests -p 'test_deployment_manager_release.py' -v
          python -m unittest discover -s backend/tests -p 'test_generate_local_secrets.py' -v
      - name: Validate Linux launchers
        run: bash -n AIRDEPLOY.sh AIRSTART.sh deploy/deploy-swarm.sh
      - name: Parse Windows Deployment Manager and startup scripts
        shell: pwsh
        run: |
          foreach ($file in @("AIRDEPLOY.ps1", "AIRSTART.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }


  release-package:
    needs: onprem-compose-runtime-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build AIR release bundle and checksums
        run: python scripts/release/build_release.py --version "ci-${GITHUB_SHA:0:12}" --output-dir dist
      - name: Verify the generated release bundle
        run: python scripts/release/build_release.py --verify "dist/air-release-ci-${GITHUB_SHA:0:12}.tar.gz"
      - name: Download verified runtime container images
        uses: actions/download-artifact@v4
        with:
          name: air-container-images-${{ github.sha }}
          path: dist/images
      - name: Upload complete AIR release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: air-release-${{ github.sha }}
          path: |
            dist/air-release-*.tar.gz
            dist/air-release-*.tar.gz.sha256
            dist/images/air-container-images-*.tar.gz
            dist/images/air-container-images-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30


  onprem-compose-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose runtime
        run: |
          docker version
          docker compose version
      - name: Boot and verify the complete on-prem Compose service set
        run: bash scripts/ci/onprem-compose-runtime-smoke.sh
      - name: Package the verified API, PWA and infrastructure images
        run: |
          set -Eeuo pipefail
          version="ci-${GITHUB_SHA:0:12}"
          docker tag air-model-engine-api:local "air-model-engine-api:$version"
          docker tag air-model-engine-api:local air-model-engine-api:lab
          docker tag air-model-engine-pwa:local "air-model-engine-pwa:$version"
          docker tag air-model-engine-pwa:local air-model-engine-pwa:lab
          docker pull caddy:2-alpine
          mkdir -p dist
          docker save \
            air-model-engine-api:local air-model-engine-api:lab "air-model-engine-api:$version" \
            air-model-engine-pwa:local air-model-engine-pwa:lab "air-model-engine-pwa:$version" \
            postgres:16-alpine redis:7-alpine rabbitmq:4-management-alpine caddy:2-alpine \
            | gzip -1 > "dist/air-container-images-$version.tar.gz"
          sha256sum "dist/air-container-images-$version.tar.gz" > "dist/air-container-images-$version.tar.gz.sha256"
      - name: Upload verified runtime container images
        uses: actions/upload-artifact@v4
        with:
          name: air-container-images-${{ github.sha }}
          path: |
            dist/air-container-images-*.tar.gz
            dist/air-container-images-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30


  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - name: Check committed Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate -no-color
      - name: Verify safe defaults
        run: |
          grep -q 'default     = false' variables.tf
          grep -q 'var.deploy_services ? 1 : 0' ecs.tf
          grep -q 'deletion_protection' data.tf
          grep -q 'transit_encryption_enabled = true' data.tf
          grep -q 'block_public_acls' data.tf
          grep -q 'publicly_accessible        = false' data.tf
      - name: Verify SaaS tenant provisioning infrastructure contract
        run: |
          grep -q 'aws_caller_identity' versions.tf
          grep -q 'AIR_RABBITMQ_MANAGEMENT_URL' ecs.tf
          grep -q 'AIR_RABBITMQ_ADMIN_PASSWORD' ecs.tf
          grep -q 'AIR_TENANT_S3_BUCKET_PREFIX' ecs.tf
          grep -q 'AIR_TENANT_SECRETS_PREFIX' ecs.tf
          grep -q 's3:CreateBucket' ecs.tf
          grep -q 'secretsmanager:CreateSecret' ecs.tf
          grep -q '15671' security.tf
