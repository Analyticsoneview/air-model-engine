name: AIR iPhone Web App (Self-hosted PWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'deploy/nginx-air-pwa.conf'
      - '.github/workflows/ios-pwa.yml'

permissions:
  contents: read

concurrency:
  group: air-pwa-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.AIR_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter web platform
        working-directory: mobile
        run: flutter create . --platforms=web --org com.analyticalstocks

      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Build optimized AIR PWA
        working-directory: mobile
        env:
          AIR_API_BASE_URL: ${{ vars.AIR_API_BASE_URL }}
        run: |
          if [ -z "$AIR_API_BASE_URL" ]; then
            echo "AIR_API_BASE_URL repository variable is required for a connected build."
            exit 1
          fi
          flutter build web --release --tree-shake-icons --no-source-maps --base-href "/" --dart-define=APP_ENV=production --dart-define=AIR_API_BASE_URL="$AIR_API_BASE_URL"

      - name: Report web bundle size
        working-directory: mobile
        run: du -sh build/web

      - name: Upload self-hosted PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: air-pwa-web
          path: mobile/build/web/
          retention-days: 30
