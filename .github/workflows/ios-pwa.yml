name: AIR iPhone Web App (PWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-pwa.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: air-pwa-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter web platform
        working-directory: mobile
        run: flutter create . --platforms=web --org com.analyticalstocks

      - name: Resolve packages
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib

      - name: Build optimized AIR PWA
        working-directory: mobile
        run: flutter build web --release --tree-shake-icons --no-source-maps --base-href "/${GITHUB_REPOSITORY#*/}/" --dart-define=APP_ENV=lab

      - name: Report web bundle size
        working-directory: mobile
        run: |
          du -sh build/web
          find build/web -type f -printf '%s %p\\n' | sort -nr | head -15

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
