name: AIR iPhone Web App (Self-hosted PWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'deploy/nginx-air-pwa.conf'
      - '.github/workflows/ios-pwa.yml'

permissions:
  contents: read

concurrency:
  group: air-pwa-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, air-ci]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify preinstalled AIR Flutter
        shell: powershell
        run: |
          $flutterBin = 'C:\AIR\tools\flutter\bin'
          $flutter = Join-Path $flutterBin 'flutter.bat'
          if (-not (Test-Path $flutter)) {
            throw "Preinstalled AIR Flutter not found at $flutter"
          }
          & $flutter --version
          if ($LASTEXITCODE -ne 0) {
            throw "Preinstalled AIR Flutter failed its version check."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $flutterBin

      - name: Generate Flutter web platform
        working-directory: mobile
        shell: powershell
        run: flutter create . --platforms=web --org com.analyticalstocks

      - name: Resolve packages
        working-directory: mobile
        shell: powershell
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile
        shell: powershell
        run: flutter analyze lib

      - name: Run Flutter tests
        working-directory: mobile
        shell: powershell
        run: flutter test

      - name: Build optimized AIR PWA
        working-directory: mobile
        env:
          AIR_API_BASE_URL: ${{ vars.AIR_API_BASE_URL }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AIR_API_BASE_URL)) {
            throw "AIR_API_BASE_URL repository variable is required for a connected build."
          }
          flutter build web --release --tree-shake-icons --no-source-maps --base-href "/" --dart-define=APP_ENV=production --dart-define=AIR_API_BASE_URL="$env:AIR_API_BASE_URL"

      - name: Report web bundle size
        working-directory: mobile
        shell: powershell
        run: |
          $bytes = (Get-ChildItem build/web -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host ("AIR PWA bundle size: {0:N2} MB" -f ($bytes / 1MB))

      - name: Upload self-hosted PWA bundle
        uses: actions/upload-artifact@v4
        with:
          name: air-pwa-web
          path: mobile/build/web/
          retention-days: 30
