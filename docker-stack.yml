version: "3.9"

services:
  air-api:
    image: ${AIR_BACKEND_IMAGE:-air-model-engine-api:lab}
    environment:
      AIR_JWT_SECRET_FILE: /run/secrets/air_jwt_secret
      AIR_CREDENTIAL_KEY_FILE: /run/secrets/air_credential_key
      AIR_ADMIN_API_KEY_FILE: /run/secrets/air_admin_api_key
      AIR_ADMIN_MFA_KEY_FILE: /run/secrets/air_admin_mfa_key
      AIR_AUTH_DB_PATH: /var/lib/air/auth.sqlite3
      AIR_ACCOUNT_DB_PATH: /var/lib/air/accounts.sqlite3
      AIR_CREDENTIAL_DB_PATH: /var/lib/air/credentials.sqlite3
      AIR_ORDER_DB_PATH: /var/lib/air/orders.sqlite3
      AIR_QOC_DB_PATH: /var/lib/air/qoc.sqlite3
      AIR_QOC_SCHEDULER_ENABLED: ${AIR_QOC_SCHEDULER_ENABLED:-false}
      AIR_QOC_DHAN_AUTO_RENEW_ENABLED: ${AIR_QOC_DHAN_AUTO_RENEW_ENABLED:-false}
      AIR_QOC_DHAN_ACCOUNT_ID: ${AIR_QOC_DHAN_ACCOUNT_ID:-}
      AIR_QOC_DHAN_UNDERLYINGS: ${AIR_QOC_DHAN_UNDERLYINGS:-[]}
      AIR_ALLOW_CUSTOMER_SIGNUP: "false"
      AIR_CORS_ORIGINS: ${AIR_CORS_ORIGINS:-https://air.example.com}
      AIR_OPERATOR_CUSTOMER_IDS: ${AIR_OPERATOR_CUSTOMER_IDS:?Set operator customer UUIDs}
      AIR_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/air_telegram_bot_token
      AIR_TELEGRAM_CHAT_IDS: ${AIR_TELEGRAM_CHAT_IDS:-}
      AIR_TELEGRAM_CONFIG_DB_PATH: /var/lib/air/air_telegram_config.sqlite3
      AIR_TELEGRAM_DEDUPE_DB_PATH: /var/lib/air/air_telegram_notifications.sqlite3
      AIR_TELEGRAM_SCHEDULER_ENABLED: ${AIR_TELEGRAM_SCHEDULER_ENABLED:-false}
      AIR_SMTP_HOST: ${AIR_SMTP_HOST:-}
      AIR_SMTP_PORT: ${AIR_SMTP_PORT:-587}
      AIR_SMTP_USERNAME: ${AIR_SMTP_USERNAME:-}
      AIR_REPORT_FROM_EMAIL: ${AIR_REPORT_FROM_EMAIL:-}
      AIR_SMTP_PASSWORD_FILE: /run/secrets/air_smtp_password
      AIR_MARKET_SOURCE_DB_PATH: /var/lib/air/market_sources.sqlite3
      AIR_MARKET_INSTRUMENT_DB_PATH: /var/lib/air/market_instruments.sqlite3
      AIR_MARKET_DATA_POLL_SECONDS: ${AIR_MARKET_DATA_POLL_SECONDS:-3}
      AIR_NSE_DB_PATH: /var/lib/air/nse_bhavcopy.sqlite3
      AIR_NSE_ARCHIVE_DIR: /var/lib/air/nse_archives
      AIR_NSE_BOOTSTRAP_ENABLED: ${AIR_NSE_BOOTSTRAP_ENABLED:-true}
      AIR_CLIENT_LOCAL_IP: ${AIR_CLIENT_LOCAL_IP:-}
      AIR_CLIENT_PUBLIC_IP: ${AIR_CLIENT_PUBLIC_IP:-}
      AIR_CLIENT_MAC_ADDRESS: ${AIR_CLIENT_MAC_ADDRESS:-}
    secrets:
      - air_jwt_secret
      - air_credential_key
      - air_admin_api_key
      - air_admin_mfa_key
      - air_telegram_bot_token
      - air_smtp_password
    volumes:
      - air_data:/var/lib/air
    networks:
      - air_private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 60s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "2.0"
          memory: 1G
      placement:
        constraints:
          - node.role == manager

  air-pwa:
    image: ${AIR_PWA_IMAGE:-air-model-engine-pwa:lab}
    networks:
      - air_private
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 5s
        monitor: 60s
        failure_action: pause
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        reservations:
          cpus: "0.1"
          memory: 32M
        limits:
          cpus: "0.5"
          memory: 128M
      placement:
        constraints:
          - node.role == manager

  air-caddy:
    image: caddy:2-alpine
    environment:
      AIR_APP_DOMAIN: ${AIR_APP_DOMAIN:?Set AIR_APP_DOMAIN}
      AIR_API_DOMAIN: ${AIR_API_DOMAIN:?Set AIR_API_DOMAIN}
      AIR_TLS_EMAIL: ${AIR_TLS_EMAIL:?Set AIR_TLS_EMAIL}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: udp
        mode: ingress
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - air_private
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

networks:
  air_private:
    driver: overlay
    attachable: true

volumes:
  air_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

secrets:
  air_jwt_secret:
    external: true
  air_credential_key:
    external: true
  air_admin_api_key:
    external: true
  air_admin_mfa_key:
    external: true
  air_telegram_bot_token:
    external: true
    name: ${AIR_TELEGRAM_SECRET_NAME:-air_telegram_bot_token}
  air_smtp_password:
    external: true
